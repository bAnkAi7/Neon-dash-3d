<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070b1c"><meta name="description" content="Neon Dash 3D — dodge, jump, collect, and survive. A free endless runner."><title>Neon Dash 3D</title>
<style>
:root{color-scheme:dark;--cyan:#42f5e9;--pink:#ff4f9a;--gold:#ffd166;--panel:rgba(10,17,39,.76)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b1c;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#f7fbff;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block}#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(2,4,15,.48) 100%)}.hud{position:fixed;inset:0;pointer-events:none;padding:clamp(12px,3vw,28px);display:flex;flex-direction:column;justify-content:space-between}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand{font-weight:950;letter-spacing:.12em;font-size:clamp(15px,2.6vw,22px);text-shadow:0 0 20px #36d9ef66}.brand span{color:var(--cyan)}.tagline{font-size:10px;letter-spacing:.22em;color:#aab8d7;margin-top:3px}.stats{display:flex;gap:9px}.stat{min-width:78px;padding:9px 13px;border:1px solid #7be8ff2e;border-radius:13px;background:var(--panel);backdrop-filter:blur(10px);text-align:right}.stat small{display:block;color:#9eaccb;font-size:9px;letter-spacing:.16em;font-weight:800}.stat strong{font-size:clamp(17px,3vw,23px);font-variant-numeric:tabular-nums}.stat.coins strong{color:var(--gold)}.bottom{display:flex;justify-content:space-between;align-items:end;gap:10px}.hint{font-size:11px;color:#aeb9d4;letter-spacing:.05em;text-shadow:0 1px 5px #000}.hint b{color:#f6fbff}.mobile-controls{display:none;gap:10px;pointer-events:auto}.ctrl{border:1px solid #75eaf75c;background:#07172ccc;color:white;border-radius:15px;width:56px;height:52px;font-size:22px;font-weight:800;box-shadow:inset 0 0 18px #33d9ed13;backdrop-filter:blur(8px);user-select:none;-webkit-user-select:none}.ctrl:active{background:#1a5367}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,rgba(4,7,20,.12),rgba(4,7,20,.45));}.card{width:min(440px,100%);padding:clamp(23px,5vw,38px);border-radius:25px;background:linear-gradient(145deg,rgba(16,28,59,.95),rgba(6,12,31,.94));border:1px solid #7aefff45;box-shadow:0 25px 90px #0008,0 0 55px #22d6ef12;text-align:center;backdrop-filter:blur(16px)}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.28em;color:var(--cyan);margin-bottom:12px}.card h1{margin:0;font-size:clamp(32px,8vw,54px);line-height:.96;letter-spacing:-.06em;font-weight:1000}.card h1 span{color:var(--cyan);text-shadow:0 0 30px #42f5e966}.card p{color:#b8c5df;font-size:13px;line-height:1.65;margin:18px auto 22px;max-width:320px}.primary{border:0;width:100%;padding:15px 18px;border-radius:13px;background:linear-gradient(100deg,#40f4e4,#6baeff);color:#061226;font-size:13px;font-weight:950;letter-spacing:.12em;box-shadow:0 8px 28px #42f5e933;cursor:pointer}.primary:active{transform:translateY(1px)}.secondary{margin-top:10px;border:1px solid #83edff3d;background:#0c1830;color:#d8eaff;width:100%;padding:12px;border-radius:12px;font-weight:750;cursor:pointer}.tips{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:18px;color:#94a6c9;font-size:10px}.tips span{white-space:nowrap}.hidden{display:none!important}.pause-btn{pointer-events:auto;border:1px solid #7be8ff33;background:var(--panel);color:white;border-radius:12px;width:42px;height:40px;font-size:15px;cursor:pointer}.right-tools{display:flex;gap:8px;align-items:start}.toast{position:fixed;top:24%;left:50%;transform:translateX(-50%);font-weight:950;font-size:18px;letter-spacing:.08em;color:var(--gold);text-shadow:0 2px 15px #ff9d3b88;pointer-events:none;opacity:0;transition:opacity .2s}.toast.show{opacity:1}@media(max-width:650px){.mobile-controls{display:flex}.hint{display:none}.stat{min-width:66px;padding:7px 9px}.stats{gap:6px}.bottom{align-items:end}.pause-btn{width:38px;height:38px}.brand{font-size:15px}.tagline{font-size:8px}.card p{font-size:12px}}
</style></head><body>
<canvas id="game" aria-label="Neon Dash 3D game canvas"></canvas><div id="vignette"></div>
<div class="hud"><div class="topbar"><div><div class="brand">NEON <span>DASH</span></div><div class="tagline">RUN THE FUTURE</div></div><div class="right-tools"><div class="stats"><div class="stat"><small>SCORE</small><strong id="score">00000</strong></div><div class="stat coins"><small>COINS</small><strong id="coins">0</strong></div></div><button id="pause" class="pause-btn hidden" aria-label="Pause game">Ⅱ</button></div></div><div class="bottom"><div class="hint"><b>← →</b> CHANGE LANE &nbsp; <b>SPACE / ↑</b> JUMP &nbsp; <b>P</b> PAUSE</div><div class="mobile-controls"><button class="ctrl" id="left" aria-label="Move left">‹</button><button class="ctrl" id="jump" aria-label="Jump">↑</button><button class="ctrl" id="right" aria-label="Move right">›</button></div></div></div>
<div id="overlay" class="overlay"><div class="card"><div class="eyebrow">ARCADE RUNNER · SEASON 01</div><h1>NEON<br><span>DASH 3D</span></h1><p>Three lanes. Endless speed. One rule: don't get hit. Dodge barriers, leap over hazards, and collect neon coins to set a new record.</p><button id="start" class="primary">START RUN&nbsp; ↗</button><div class="tips"><span>◀ ▶ MOVE</span><span>↑ JUMP</span><span>✦ COLLECT COINS</span></div></div></div>
<div id="toast" class="toast">+1 COIN</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),coinsEl=document.getElementById('coins'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('start'),pauseBtn=document.getElementById('pause'),toast=document.getElementById('toast');
let W=innerWidth,H=innerHeight,DPR=1,last=0,raf=0,state='menu',score=0,coins=0,best=Number(localStorage.getItem('neonDashBest')||0),speed=0.34,spawn=0,objects=[],particles=[],player={lane:0,xLane:0,jump:0,jumpV:0,tilt:0};
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize,{passive:true});resize();
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function horizon(){return H*.29}function roadHalf(z){return W*(.075+z*.43)}function roadY(z){return horizon()+Math.pow(z,1.55)*(H*.79)}function laneX(lane,z){return W/2+lane*roadHalf(z)*.62}
function poly(points,fill,stroke=null,lw=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function drawBackground(t){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#070b20');sky.addColorStop(.55,'#15264b');sky.addColorStop(1,'#0a1027');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
// distant glow
let g=ctx.createRadialGradient(W*.5,horizon(),5,W*.5,horizon(),W*.6);g.addColorStop(0,'#2a8eae55');g.addColorStop(1,'#0a102700');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
// stars
for(let i=0;i<55;i++){let x=(i*137.5%W),y=(i*53.7%(horizon()*.9));ctx.fillStyle=`rgba(157,229,255,${.16+.3*(.5+.5*Math.sin(t*.0007+i))})`;ctx.fillRect(x,y,1.4,1.4)}
// skyline
for(let i=0;i<20;i++){let bw=W/14, x=(i*W/12 - W*.1),bh=18+((i*47)%80);ctx.fillStyle=i%3===0?'#111f42':'#0c1734';ctx.fillRect(x,horizon()-bh,bw,bh);for(let wy=horizon()-bh+8;wy<horizon()-3;wy+=10)for(let wx=x+6;wx<x+bw-3;wx+=9){ctx.fillStyle=(i+Math.floor(wy)+Math.floor(wx))%4===0?'#46e5ed44':'#9bb8ef18';ctx.fillRect(wx,wy,2,3)}}
}
function drawRoad(t){let hy=horizon(),bottom=H*1.08,halfTop=roadHalf(0),halfBottom=roadHalf(1);poly([[W/2-halfTop,hy],[W/2+halfTop,hy],[W/2+halfBottom,bottom],[W/2-halfBottom,bottom]],'#111a34','#315d86',1.5);
// outer neon rails
for(let s of [-1,1]){ctx.beginPath();ctx.moveTo(W/2+s*halfTop,hy);ctx.lineTo(W/2+s*halfBottom,bottom);ctx.strokeStyle='#43f4e8';ctx.lineWidth=2;ctx.shadowBlur=14;ctx.shadowColor='#30f3ee';ctx.stroke();ctx.shadowBlur=0}
// road stripes and lane dividers
for(let i=0;i<28;i++){let z=((i/28+(t*.00024)%1)%1);let y=roadY(z),xhalf=roadHalf(z),w=1+z*3;ctx.fillStyle=`rgba(65,224,241,${.08+z*.4})`;ctx.fillRect(W/2-xhalf,y,w,2+z*3);for(let d of [-1,1]){let x=W/2+d*xhalf/3;ctx.strokeStyle=`rgba(76,220,255,${.12+z*.48})`;ctx.lineWidth=1+z*1.4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+ (d*2),y+3+z*9);ctx.stroke()}}
// lane dashed dividers
for(let lane of [-1,1])for(let i=0;i<13;i++){let z=((i/13+(t*.00035)%1)%1),y=roadY(z),x=W/2+lane*roadHalf(z)/3;ctx.strokeStyle=`rgba(136,177,218,${.12+z*.35})`;ctx.lineWidth=1+z*2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+3+z*18);ctx.stroke()}
// glowing ground grid
for(let i=0;i<9;i++){let z=((i/9+(t*.0003)%1)%1);let y=roadY(z);ctx.strokeStyle=`rgba(67,245,233,${.025+z*.12})`;ctx.beginPath();ctx.moveTo(W/2-roadHalf(z),y);ctx.lineTo(W/2+roadHalf(z),y);ctx.stroke()}}
function roundedRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}}
function drawPlayer(t){let z=.86,x=W/2+player.xLane*roadHalf(z)*.62,y=roadY(z),scale=.65+z*.65;let jumpY=player.jump*H*.18;let bodyW=22*scale,bodyH=42*scale;ctx.save();ctx.translate(x,y-jumpY);ctx.rotate(player.tilt*.12);
// shadow
ctx.globalAlpha=clamp(1-player.jump*.55,.2,1);ctx.fillStyle='#020712aa';ctx.beginPath();ctx.ellipse(0,4,bodyW*1.25,bodyW*.35,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
// legs animated
let run=state==='running'?Math.sin(t*.018)*5*scale:0;ctx.strokeStyle='#071222';ctx.lineWidth=8*scale;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-5*scale,bodyH*.52);ctx.lineTo((-8+run)*scale,bodyH*.83);ctx.moveTo(5*scale,bodyH*.52);ctx.lineTo((8-run)*scale,bodyH*.83);ctx.stroke();ctx.strokeStyle='#42f5e9';ctx.lineWidth=3*scale;ctx.beginPath();ctx.moveTo((-8+run)*scale,bodyH*.83);ctx.lineTo((-11+run)*scale,bodyH*.84);ctx.moveTo((8-run)*scale,bodyH*.83);ctx.lineTo((11-run)*scale,bodyH*.84);ctx.stroke();
// torso
let grad=ctx.createLinearGradient(-bodyW,0,bodyW,0);grad.addColorStop(0,'#187da3');grad.addColorStop(.5,'#51f5e6');grad.addColorStop(1,'#1970a2');roundedRect(-bodyW*.56,-bodyH*.1,bodyW*1.12,bodyH*.7,bodyW*.25,grad,'#a5fff7');
// arms
ctx.strokeStyle='#b6fff8';ctx.lineWidth=5*scale;ctx.beginPath();ctx.moveTo(-bodyW*.48,bodyH*.04);ctx.lineTo(-bodyW*.82,bodyH*.36+run*.25);ctx.moveTo(bodyW*.48,bodyH*.04);ctx.lineTo(bodyW*.82,bodyH*.36-run*.25);ctx.stroke();
// helmet
let hg=ctx.createLinearGradient(-bodyW,0,bodyW,0);hg.addColorStop(0,'#273e72');hg.addColorStop(.5,'#d8ffff');hg.addColorStop(1,'#4779a6');ctx.fillStyle=hg;ctx.beginPath();ctx.ellipse(0,-bodyH*.22,bodyW*.54,bodyW*.58,0,0,Math.PI*2);ctx.fill();roundedRect(-bodyW*.39,-bodyH*.25,bodyW*.78,bodyW*.22,bodyW*.09,'#10294b','#4bfff0');ctx.restore()}
function drawObstacle(o){let z=o.z;if(z<0||z>1.2)return;let x=laneX(o.lane,z),y=roadY(z),s=.25+z*1.35;ctx.save();ctx.translate(x,y);if(o.type==='coin'){let r=7*s;ctx.rotate(Math.sin(o.spin)*.3);ctx.shadowBlur=18*s;ctx.shadowColor='#ffd166';ctx.fillStyle='#ffce5a';ctx.beginPath();ctx.ellipse(0,-r*2,r*.72,r,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff1ae';ctx.lineWidth=1.5*s;ctx.beginPath();ctx.ellipse(0,-r*2,r*.38,r*.72,0,0,Math.PI*2);ctx.stroke();ctx.restore();return}
let w=(o.type==='barrier'?30:25)*s,h=(o.type==='barrier'?20:31)*s;ctx.shadowBlur=14*s;ctx.shadowColor=o.type==='barrier'?'#ff4f9a':'#ff8b52';let c=o.type==='barrier'?'#ff4f9a':'#ff8b52';poly([[-w/2,-h],[w/2,-h],[w/2,0],[-w/2,0]],c,'#ffd6e6',1*s);poly([[-w/2,-h],[ -w/2+5*s,-h-5*s],[w/2+5*s,-h-5*s],[w/2,-h]],o.type==='barrier'?'#b72b70':'#c75432','#ffc2d6',.7*s);ctx.shadowBlur=0;ctx.fillStyle='#fff4';ctx.fillRect(-w*.36,-h*.78,w*.72,2*s);ctx.restore()}
function drawParticles(dt){for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0)}
function burst(x,y,color,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-.25,.25),vy:rand(-.4,.1),life:rand(250,600),max:600,size:rand(2,5),color})}
function draw(t=0){drawBackground(t);drawRoad(t);objects.slice().sort((a,b)=>a.z-b.z).forEach(drawObstacle);drawPlayer(t);drawParticles(16);}
function addObject(){let lane=[-1,0,1][Math.floor(Math.random()*3)];let type=Math.random()<.34?'coin':(Math.random()<.48?'barrier':'block');objects.push({lane,z:.02,type,spin:rand(0,6),hit:false});if(type!=='coin'&&Math.random()<.38){let other=[-1,0,1].filter(v=>v!==lane)[Math.floor(Math.random()*2)];objects.push({lane:other,z:.02,type:'coin',spin:rand(0,6),hit:false})}}
function update(dt){if(state!=='running')return;let sec=dt/1000;speed=Math.min(.72,speed+sec*.003);score+=sec*(12+speed*12);scoreEl.textContent=String(Math.floor(score)).padStart(5,'0');spawn-=sec; if(spawn<=0){addObject();spawn=Math.max(.38,rand(.68,1.12)-speed*.42)}
player.xLane+=(player.lane-player.xLane)*Math.min(1,sec*12);if(player.jump>0){player.jump+=player.jumpV*sec;player.jumpV-=3.2*sec;if(player.jump<=0){player.jump=0;player.jumpV=0}}
for(let o of objects){o.z+=speed*sec;o.spin+=sec*7;if(!o.hit&&o.z>.77&&o.z<.94&&Math.abs(o.lane-player.xLane)<.52){if(o.type==='coin'){o.hit=true;coins++;coinsEl.textContent=coins;score+=50;burst(laneX(o.lane,o.z),roadY(o.z)-18,'#ffd166',8);toast.classList.add('show');toast.textContent='+1 COIN';setTimeout(()=>toast.classList.remove('show'),450)}else if(player.jump<.42){o.hit=true;gameOver();return}else{o.hit=true}}}
objects=objects.filter(o=>o.z<1.12&&!o.hit);}
function loop(t){let dt=Math.min(40,t-(last||t));last=t;if(state==='running')update(dt);draw(t);raf=requestAnimationFrame(loop)}
function reset(){score=0;coins=0;speed=.34;spawn=.45;objects=[];particles=[];player={lane:0,xLane:0,jump:0,jumpV:0,tilt:0};scoreEl.textContent='00000';coinsEl.textContent='0'}
function begin(){reset();state='running';overlay.classList.add('hidden');pauseBtn.classList.remove('hidden');last=performance.now()}
function gameOver(){state='over';pauseBtn.classList.add('hidden');best=Math.max(best,Math.floor(score));localStorage.setItem('neonDashBest',String(best));overlay.classList.remove('hidden');overlay.querySelector('.eyebrow').textContent='RUN COMPLETE';overlay.querySelector('h1').innerHTML='NICE<br><span>TRY!</span>';overlay.querySelector('p').innerHTML=`SCORE <b style="color:#42f5e9">${Math.floor(score)}</b> &nbsp; · &nbsp; COINS <b style="color:#ffd166">${coins}</b><br>PERSONAL BEST <b style="color:#fff">${best}</b><br><br>Every run makes you faster. Ready for another?`;startBtn.textContent='RUN IT BACK  ↗';overlay.querySelector('.tips').innerHTML='<span>KEEP MOVING</span><span>TIME YOUR JUMPS</span>';}
function pause(){if(state==='running'){state='paused';overlay.classList.remove('hidden');overlay.querySelector('.eyebrow').textContent='TAKE A BREATHER';overlay.querySelector('h1').innerHTML='RUN<br><span>PAUSED</span>';overlay.querySelector('p').textContent='Your run is paused. Catch your breath, then get back out there.';startBtn.textContent='RESUME RUN  ↗';overlay.querySelector('.tips').innerHTML='<span>YOUR RUN IS SAFE</span>'; }else if(state==='paused'){state='running';overlay.classList.add('hidden');last=performance.now()}}
function move(d){if(state!=='running')return;player.lane=clamp(player.lane+d,-1,1);player.tilt=d*.8}
function jump(){if(state!=='running'||player.jump>0)return;player.jump=.02;player.jumpV=2.6}
startBtn.addEventListener('click',()=>{if(state==='paused'){pause();return}begin()});pauseBtn.addEventListener('click',pause);
document.getElementById('left').addEventListener('pointerdown',e=>{e.preventDefault();move(-1)});document.getElementById('right').addEventListener('pointerdown',e=>{e.preventDefault();move(1)});document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','w','A','D','W','p','P','Escape'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')move(-1);else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')move(1);else if(e.key==='ArrowUp'||e.key===' '||e.key==='w'||e.key==='W')jump();else if(e.key==='p'||e.key==='P'||e.key==='Escape')pause();else if(e.key==='Enter'&&(state==='menu'||state==='over'))begin()});
let touchX=null;canvas.addEventListener('touchstart',e=>{if(state!=='running')return;touchX=e.changedTouches[0].clientX},{passive:true});canvas.addEventListener('touchend',e=>{if(touchX===null)return;let dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>35)move(dx>0?1:-1);else if(e.changedTouches[0].clientY<H*.65)jump();touchX=null},{passive:true});
// Small test hooks for automated sanity checks; no effect on normal play.
window.__NEON_DASH_TEST__={getState:()=>state,getScore:()=>score,getCoins:()=>coins,getObjectCount:()=>objects.length,start:begin,move,jump,tick:(ms)=>update(ms),gameOver,resize};
raf=requestAnimationFrame(loop);
})();
</script></body></html>
